<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Shavor's Desk ♠️</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shavor's Desk">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2a3139; --txt:#e6edf3;
          --dim:#8b949e; --grok:#a371f7; --gemini:#58a6ff; --me:#238636; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 14px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:10px; background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .spade { color:var(--grok); }
  #status { margin-left:auto; font-size:12px; color:var(--dim); }
  #status.on { color:#3fb950; }
  .iconbtn { background:transparent; border:1px solid var(--line); color:var(--txt);
             border-radius:10px; padding:7px 10px; font-size:16px; cursor:pointer; }
  .iconbtn.on { border-color:var(--grok); background:#221a38; }
  .iconbtn.rec { border-color:#f85149; background:#3d1414; }
  #desk { font-size:12px; color:var(--dim); background:var(--panel);
          border-bottom:1px solid var(--line); padding:8px 14px; line-height:1.5; }
  #desk b { color:var(--txt); }
  #desk .greet { color:var(--txt); font-weight:600; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex;
         flex-direction:column; gap:10px; }
  .msg { max-width:92%; padding:10px 12px; border-radius:12px; line-height:1.5;
         font-size:14px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.me { align-self:flex-end; background:#12351f; border:1px solid #1f5c33; }
  .msg.grok { align-self:flex-start; background:var(--panel);
              border:1px solid var(--line); border-left:3px solid var(--grok); }
  .msg.gemini { align-self:flex-start; background:var(--panel);
              border:1px solid var(--line); border-left:3px solid var(--gemini); }
  .msg.ace { align-self:flex-start; background:var(--panel);
              border:1px solid var(--line); border-left:3px solid #3fb950; }
  .who { font-size:11px; font-weight:700; letter-spacing:.06em; margin-bottom:4px; }
  .who img.av { width:18px; height:18px; border-radius:50%;
                vertical-align:-4px; margin-right:6px; }
  .who.grok { color:var(--grok); } .who.gemini { color:var(--gemini); }
  .who.me { color:#3fb950; } .who.ace { color:#3fb950; }
  .round { font-size:10px; color:var(--dim); margin-left:6px; font-weight:400; }
  .ts { font-size:10px; color:var(--dim); margin-left:6px; font-weight:400; }
  .thinking { font-size:12px; color:var(--dim); font-style:italic; }
  #bar { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line);
         background:var(--panel); align-items:center; }
  #input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--txt);
           border-radius:10px; padding:10px 12px; font-size:15px; outline:none; }
  #input:focus { border-color:var(--grok); }
  #send { background:var(--grok); border:0; color:#fff; font-weight:700;
          border-radius:10px; padding:10px 16px; font-size:15px; cursor:pointer; }
  #send:disabled { opacity:.4; }
  .toggle { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim);
            white-space:nowrap; }
  .msg img.media, .msg video.media { display:block; max-width:100%; margin-top:8px;
                                     border-radius:10px; }
  .msg img.media { max-height:320px; object-fit:contain; background:#0d1117; }
  .msg video.media { width:100%; max-height:360px; background:#000; }
  #pending { display:none; align-items:center; gap:8px; padding:8px 12px;
             border-top:1px solid var(--line); background:var(--panel);
             font-size:12px; color:var(--dim); }
  #pending.on { display:flex; }
  #pending img, #pending video { width:42px; height:42px; object-fit:cover;
                                 border-radius:8px; background:#000; }
  #pending .pname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #pending button { margin-left:auto; }
  #attachNote { color:#f85149; }
  #gate { margin:auto; max-width:340px; text-align:center; padding:24px;
          background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  #gate h2 { margin:0 0 8px; font-size:17px; }
  #gate p { color:var(--dim); font-size:13px; line-height:1.5; }
  #gate input { width:100%; background:var(--bg); border:1px solid var(--line);
                color:var(--txt); border-radius:10px; padding:10px 12px;
                font-size:15px; margin:8px 0; outline:none; }
  #gate button { width:100%; background:var(--grok); border:0; color:#fff;
                 font-weight:700; border-radius:10px; padding:11px; font-size:15px; }
  @media (max-width:640px){ #desk{font-size:11px} .toggle span{display:none} }
</style>
</head>
<body>
<header>
  <span class="spade">♠️</span><h1>Shavor's Desk</h1>
  <span id="status">connecting…</span>
  <button id="speakBtn" class="iconbtn" title="Read new messages aloud">🔇</button>
  <button id="micBtn" class="iconbtn" title="Dictate your message">🎤</button>
</header>
<div id="desk">loading desk context…</div>
<div id="log"></div>
<div id="pending"></div>
<div id="bar">
  <button id="attachBtn" class="iconbtn" type="button" title="Attach a photo or video">📎</button>
  <input id="file" type="file" hidden
         accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime,video/webm,.jpg,.jpeg,.png,.gif,.webp,.mp4,.mov,.webm">
  <label class="toggle" title="Each model reacts to the other's take before the round closes">
    <input type="checkbox" id="xtalk"> <span>cross-talk</span>
  </label>
  <input id="input" placeholder="What's on your mind, Shavor?…" autocomplete="off">
  <button id="send">Send</button>
</div>
<script>
const qs = new URLSearchParams(location.search);
let token = qs.get("token") || "";
try {
  if (token) localStorage.setItem("desk_token", token);
  else token = localStorage.getItem("desk_token") || "";
} catch(e) {}
// Token gate: installed app opens "/" with no token param, so remember it
// after the first entry instead of baking it into the manifest.
if (!token) {
  document.getElementById("desk").textContent = "Token required to join the desk.";
  document.getElementById("log").innerHTML =
    `<div id="gate"><h2>♠️ Shavor's Desk</h2>` +
    `<p>Paste your room token once — this device remembers it, so the ` +
    `home-screen app opens straight into the room.</p>` +
    `<input id="gtok" placeholder="room token" autocomplete="off">` +
    `<button id="gjoin">Join the desk</button></div>`;
  document.getElementById("gjoin").onclick = () => {
    const t = document.getElementById("gtok").value.trim();
    if (!t) return;
    try { localStorage.setItem("desk_token", t); } catch(e) {}
    location.href = "/?token=" + encodeURIComponent(t);
  };
  throw new Error("token required");
}
const log = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
const xtalk = document.getElementById("xtalk");
const speakBtn = document.getElementById("speakBtn");
const micBtn = document.getElementById("micBtn");
let ws = null;

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

// Display names + avatars chosen by the desk partners themselves.
const NAMES = {
  grok:   ["RAIL",   "/static/avatar-rail.png"],
  gemini: ["ANCHOR", "/static/avatar-anchor.png"],
  ace:    ["ACE",    "/static/icon-192.png"],
  me:     ["SHAVOR", null]
};

function safeAttachment(att){
  if (!att || typeof att !== "object") return null;
  const url = String(att.url || "");
  if (!/^\/uploads\/[a-f0-9]{16}\.(jpg|png|gif|webp|mp4|mov|webm)$/.test(url)) return null;
  const ext = url.split(".").pop();
  const kind = (ext === "mp4" || ext === "mov" || ext === "webm") ? "video" : "image";
  if (att.kind !== kind) return null;
  return {url, kind, name: String(att.name || "")};
}
function mediaHtml(att){
  att = safeAttachment(att);
  if (!att) return "";
  const src = att.url + "?token=" + encodeURIComponent(token);
  if (att.kind === "video")
    return `<video class="media" src="${esc(src)}" controls playsinline preload="metadata"></video>`;
  return `<img class="media" src="${esc(src)}" alt="${esc(att.name || "photo")}">`;
}
function addMsg(who, text, round, ts, attachment){
  const div = document.createElement("div");
  div.className = "msg " + who;
  const nm = NAMES[who] || [who.toUpperCase(), null];
  const av = nm[1] ? `<img class="av" src="${nm[1]}" alt="">` : "";
  const body = (text ? `<div>${esc(text)}</div>` : "") + mediaHtml(attachment);
  div.innerHTML = `<div class="who ${who}">${av}${nm[0]}` +
    (round && round>1 ? `<span class="round">round ${round} · reacts</span>` : "") +
    `<span class="ts">${esc(fmtTs(ts))}</span>` +
    `</div>` + body;
  log.appendChild(div); log.scrollTop = log.scrollHeight;
  return div;
}

// Every message shows who said it and when — name + date + 12-hour time.
function fmtTs(ts){
  try {
    const d = ts ? new Date(ts) : new Date();
    return d.toLocaleString(undefined,
      {month:"numeric", day:"numeric", hour:"numeric", minute:"2-digit", hour12:true});
  } catch(e){ return ""; }
}

// --- Voice: hear the room -------------------------------------------------
// Free and on-device (Web Speech API) — costs zero credits.
let speakOn = false;
const VOICE_STYLE = {
  grok:   {pitch:0.75, rate:1.0},   // Rail — low and steady
  gemini: {pitch:1.05, rate:1.0},   // Anchor — even
  ace:    {pitch:1.2,  rate:1.03},  // Ace — a touch brighter
};
let voicePool = [];
function initVoices(){
  try {
    const all = speechSynthesis.getVoices();
    voicePool = all.filter(v => /^en/i.test(v.lang || ""));
    if (!voicePool.length) voicePool = all;
  } catch(e) {}
}
if ("speechSynthesis" in window) {
  initVoices();
  speechSynthesis.onvoiceschanged = initVoices;
}
function speak(who, text){
  if (!speakOn || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel(); // one voice at a time — newest message wins
    const u = new SpeechSynthesisUtterance(text);
    const style = VOICE_STYLE[who] || {pitch:1, rate:1};
    // Spread distinct English voices across the three personas when available.
    const idx = {grok:0, gemini:1, ace:2}[who];
    if (voicePool.length && idx !== undefined)
      u.voice = voicePool[idx % voicePool.length];
    u.pitch = style.pitch; u.rate = style.rate;
    speechSynthesis.speak(u);
  } catch(e) {}
}
speakBtn.onclick = () => {
  speakOn = !speakOn;
  speakBtn.textContent = speakOn ? "🔊" : "🔇";
  speakBtn.classList.toggle("on", speakOn);
  if (!speakOn && "speechSynthesis" in window) {
    try { speechSynthesis.cancel(); } catch(e) {}
  } else if (speakOn) {
    initVoices();
    speak("ace", "Speaker on. I'll read new messages out loud. Tap again to mute me.");
  }
};

// --- Voice: talk instead of type -------------------------------------------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false;
if (!SR) { micBtn.style.display = "none"; }
else {
  micBtn.onclick = () => {
    if (recOn) { try { rec.stop(); } catch(e) {} return; }
    try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch(e) {}
    rec = new SR();
    rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = (ev) => {
      const t = ev.results[0][0].transcript || "";
      input.value = (input.value ? input.value + " " : "") + t;
      input.focus();
    };
    rec.onend = rec.onerror = () => {
      recOn = false; micBtn.textContent = "🎤"; micBtn.classList.remove("rec");
    };
    try {
      rec.start();
      recOn = true; micBtn.textContent = "🔴"; micBtn.classList.add("rec");
    } catch(e) { recOn = false; }
  };
}

function setThinking(provider, state){
  const id = "th-" + provider;
  let el = document.getElementById(id);
  if(state==="thinking" || state==="reacting"){
    if(!el){ el = document.createElement("div"); el.id=id; el.className="thinking"; log.appendChild(el); }
    el.textContent = (provider==="grok"?"Rail":provider==="gemini"?"Anchor":"Ace") +
      (state==="reacting" ? " is reacting…" : " is thinking…");
    log.scrollTop = log.scrollHeight;
  } else if(el){ el.remove(); }
}

function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { statusEl.textContent = "live"; statusEl.classList.add("on"); sendBtn.disabled=false; };
  ws.onclose = () => { statusEl.textContent = "reconnecting…"; statusEl.classList.remove("on");
                       sendBtn.disabled=true; setTimeout(connect, 2500); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if(m.type==="history"){ log.innerHTML=""; (m.messages||[]).forEach(x=>{
        if(x.from==="shavor") addMsg("me", x.text, null, x.ts, x.attachment);
        else addMsg(x.from, x.text, x.round, x.ts, x.attachment); }); }
    else if(m.type==="user"){ addMsg("me", m.text, null, m.ts, m.attachment); }
    else if(m.type==="status"){ setThinking(m.provider, m.state);
        if(m.state==="error") addMsg(m.provider, "⚠ " + (m.detail||"request failed"), null, null); }
    else if(m.type==="reply"){ setThinking(m.provider, "done"); addMsg(m.provider, m.text, m.round, m.ts); speak(m.provider, m.text); }
    else if(m.type==="done"){ /* round closed */ }
  };
}

const IMAGE_MAX = 10 * 1024 * 1024;
const VIDEO_MAX = 50 * 1024 * 1024;
const fileInput = document.getElementById("file");
const attachBtn = document.getElementById("attachBtn");
const pendingEl = document.getElementById("pending");
let pending = null, uploading = false;

function extOf(name){
  const n = (name || "").toLowerCase();
  const ext = n.includes(".") ? n.split(".").pop() : "";
  return ext === "jpeg" ? "jpg" : ext;
}
function kindOf(ext){
  if (["jpg","png","gif","webp"].includes(ext)) return "image";
  if (["mp4","mov","webm"].includes(ext)) return "video";
  return "";
}
function setPendingNote(html, on){
  pendingEl.innerHTML = html;
  pendingEl.classList.toggle("on", !!on);
}
function clearPending(){
  pending = null;
  fileInput.value = "";
  setPendingNote("", false);
}
attachBtn.onclick = () => { if (!uploading) fileInput.click(); };
fileInput.onchange = async () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  const ext = extOf(f.name);
  const kind = kindOf(ext);
  const limit = kind === "image" ? IMAGE_MAX : kind === "video" ? VIDEO_MAX : 0;
  if (!kind) { setPendingNote(`<span id="attachNote">Use a jpg, png, gif, webp, mp4, mov, or webm.</span>`, true); fileInput.value = ""; return; }
  if (f.size > limit) {
    setPendingNote(`<span id="attachNote">${kind === "image" ? "Photos" : "Videos"} must be ${kind === "image" ? "10" : "50"}MB or smaller.</span>`, true);
    fileInput.value = "";
    return;
  }
  uploading = true;
  attachBtn.disabled = true;
  setPendingNote("Uploading…", true);
  try {
    const body = new FormData();
    body.append("file", f, f.name);
    const res = await fetch("/api/upload?token=" + encodeURIComponent(token), {method:"POST", body});
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || "upload failed");
    pending = {url: data.url, kind: data.kind, name: f.name};
    const src = data.url + "?token=" + encodeURIComponent(token);
    const thumb = data.kind === "video"
      ? `<video src="${esc(src)}" muted></video>`
      : `<img src="${esc(src)}" alt="">`;
    setPendingNote(thumb + `<span class="pname">${esc(f.name)}</span><button id="clearAtt" class="iconbtn" type="button" title="Remove">✕</button>`, true);
    document.getElementById("clearAtt").onclick = clearPending;
  } catch (err) {
    pending = null;
    setPendingNote(`<span id="attachNote">${esc(err.message || "upload failed")}</span>`, true);
  } finally {
    uploading = false;
    attachBtn.disabled = false;
    fileInput.value = "";
  }
};

function send(){
  const text = input.value.trim();
  if (uploading || (!text && !pending) || !ws || ws.readyState!==1) return;
  const payload = {type:"user", text, crosstalk: xtalk.checked};
  if (pending) payload.attachment = pending;
  ws.send(JSON.stringify(payload));
  input.value = "";
  clearPending();
}

sendBtn.onclick = send;
input.addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });

function greeting(){
  const hr = new Date().getHours();
  return hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
}
fetch("/api/desk?token="+encodeURIComponent(token)).then(r=>r.json()).then(d=>{
  document.getElementById("desk").innerHTML =
    `<span class="greet">${greeting()}, Shavor.</span><br>` +
    `<b>Goal:</b> ${esc(d.goal||"")} &nbsp;·&nbsp; <b>GLND lock:</b> ${esc(d.glnd_lock||"")}<br>`+
    `<b>Risk:</b> ${esc(d.risk||"")}<br><span>${esc(d.notes||"")}</span>`;
}).catch(()=>{ document.getElementById("desk").textContent="desk context unavailable"; });

sendBtn.disabled = true;
connect();
</script>
</body>
</html>
